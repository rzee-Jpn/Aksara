<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Ultra Accurate Web Tuner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  background:#0b0f14;
  color:#eaeaea;
  font-family:system-ui, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.tuner {
  text-align:center;
  width:300px;
}
.note {
  font-size:64px;
  font-weight:700;
}
.freq {
  opacity:.7;
  margin-bottom:10px;
}
.meter {
  position:relative;
  height:6px;
  background:#222;
  border-radius:3px;
}
.needle {
  position:absolute;
  top:-7px;
  width:2px;
  height:20px;
  background:#00ff9c;
  left:50%;
  transform:translateX(-50%);
}
.status {
  margin-top:10px;
  font-size:14px;
}
</style>
</head>
<body>

<div class="tuner">
  <div class="note">–</div>
  <div class="freq">0.00 Hz</div>
  <div class="meter"><div class="needle"></div></div>
  <div class="status">Allow microphone access</div>
</div>

<script src="tuner.js"></script>
</body>
</html>
