<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Generator Aksara Jawa</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Javanese&display=swap" rel="stylesheet">
</head>
<body>

<h1>Generator Aksara Jawa</h1>
<p id="modeLabel">Latin → Aksara Jawa</p>

<textarea id="input" placeholder="Contoh: anak lanang mangan tahu"></textarea>

<div class="controls">
  <label>
    <input type="checkbox" id="murdaToggle" checked>
    Gunakan Murda
  </label>

  <div class="right">
    <button id="swapBtn">🔁 Swap</button>
    <button id="copyBtn">Salin</button>
  </div>
</div>

<div id="output"></div>

<script src="sandhangan.js"></script>
<script src="angka.js"></script>
<script src="pasangan-engine.js"></script>
<script src="reverse-engine.js"></script>
<script src="app.js"></script>
<script>
function toggleFootbar(){
  document.getElementById('footbar')
    .classList.toggle('expanded');
}

function shareTool(){
  if(navigator.share){
    navigator.share({
      title:'Generator Aksara Jawa',
      text:'Coba Generator Aksara Jawa',
      url:location.href
    });
  } else {
    alert(location.href);
  }
}

function openAnotherTools(){
  window.open('https://anglumea.github.io/tools','_blank');
}
function openSocial(){
  window.open('https://instagram.com/anglumea','_blank');
}
function openDonate(){
  window.open('https://trakteer.id/anglumea','_blank');
}
</script>

<div id="footbar" class="collapsed">
  <div id="footbar-handle" onclick="toggleFootbar()">
    <span class="handle"></span>
    <span class="brand">Anglumea</span>
  </div>

  <div class="footbar-content">
    <button onclick="shareTool()">Share Tools</button>
    <button onclick="openAnotherTools()">Another Tools</button>
    <button onclick="openSocial()">Social Media</button>
    <button onclick="openDonate()">Donate</button>
  </div>
</div>

</body>
</html>
