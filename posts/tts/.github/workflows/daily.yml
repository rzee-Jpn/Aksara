name: 🎯 Generate Daily Puzzle

on:
  # Jalan otomatis tiap hari jam 00:00 WIB (17:00 UTC)
  schedule:
    - cron: '0 17 * * *'

  # Bisa juga dijalankan manual dari GitHub Actions tab
  workflow_dispatch:
    inputs:
      days:
        description: 'Berapa hari ke depan yang di-generate'
        required: false
        default: '3'
      world:
        description: 'Generate world tertentu (kosongkan = skip worlds, daily only)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (tidak hit API)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # agar bisa commit ke repo

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Tidak ada cache: 'npm' — package-lock.json dibuat on-the-fly,
          # cache tidak bisa bekerja tanpa lock file yang di-commit.

      - name: 📦 Install dependencies
        run: |
          npm init -y
          npm install openai @anthropic-ai/sdk
          # openai  → dipakai untuk OpenAI & Groq (baseURL override)
          # @anthropic-ai/sdk → dipakai untuk Claude

      - name: 🎯 Generate Daily Puzzle
        env:
          # ── Default (fallback kalau tidak ada per-world) ──
          DEFAULT_PROVIDER:  ${{ vars.DEFAULT_PROVIDER || 'anthropic' }}
          DEFAULT_API_KEY:   ${{ secrets.DEFAULT_API_KEY }}

          # ── Per-World API (opsional, override DEFAULT) ──
          WORLD_W1_PROVIDER: ${{ vars.WORLD_W1_PROVIDER }}
          WORLD_W1_API_KEY:  ${{ secrets.WORLD_W1_API_KEY }}

          WORLD_W2_PROVIDER: ${{ vars.WORLD_W2_PROVIDER }}
          WORLD_W2_API_KEY:  ${{ secrets.WORLD_W2_API_KEY }}

          WORLD_W3_PROVIDER: ${{ vars.WORLD_W3_PROVIDER }}
          WORLD_W3_API_KEY:  ${{ secrets.WORLD_W3_API_KEY }}

          WORLD_W4_PROVIDER: ${{ vars.WORLD_W4_PROVIDER }}
          WORLD_W4_API_KEY:  ${{ secrets.WORLD_W4_API_KEY }}

          # ── Daily puzzle API ──
          DAILY_PROVIDER:    ${{ vars.DAILY_PROVIDER || vars.DEFAULT_PROVIDER || 'anthropic' }}
          DAILY_API_KEY:     ${{ secrets.DAILY_API_KEY || secrets.DEFAULT_API_KEY }}

        run: |
          DAYS=${{ github.event.inputs.days || '3' }}
          WORLD="${{ github.event.inputs.world }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"

          CMD="node generate-ai.js --daily --days $DAYS"

          # Kalau world di-input, generate world juga
          if [ -n "$WORLD" ]; then
            CMD="node generate-ai.js --world $WORLD --days $DAYS"
          fi

          # Kalau dry run
          if [ "$DRY" = "true" ] || { [ -z "$DEFAULT_API_KEY" ] && [ -z "$DAILY_API_KEY" ]; }; then
            CMD="$CMD --dry-run"
          fi

          echo "Running: $CMD"
          $CMD

      - name: 📊 Check changes
        id: check_changes
        run: |
          git diff --name-only data/
          CHANGED=$(git diff --name-only data/ | wc -l)
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "Files changed: $CHANGED"

      - name: 💾 Commit & Push
        if: steps.check_changes.outputs.changed != '0'
        run: |
          git config user.name  "TTS Bot 🤖"
          git config user.email "bot@tts-silang.app"

          git add data/
          git commit -m "🎯 Daily puzzle $(date +%Y-%m-%d)

          Auto-generated by GitHub Actions
          Provider: ${DEFAULT_PROVIDER}
          Files: $(git diff HEAD~1 --name-only data/ | tr '\n' ' ')"

          git push

      - name: ✅ No changes
        if: steps.check_changes.outputs.changed == '0'
        run: echo "Tidak ada puzzle baru yang di-generate (semua sudah ada)"
